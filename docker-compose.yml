# Entorno local: la API y su PostgreSQL. `docker compose up --build` basta: no hace falta crear un .env (ADR 0032).
# La API corre en Development y lee src/TimeTracker.Api/appsettings.Development.json (clave de firma, siembra de demostración, CORS).
# Solo para desarrollo: la siembra usa una contraseña de demostración pública, así que ambos puertos se publican únicamente en 127.0.0.1.
services:
  postgres:
    image: postgres:18-alpine
    # Credenciales de la base local de desarrollo (no de despliegue): coinciden con la cadena de conexión de appsettings.Development.json.
    # Un .env puede sobrescribirlas. No se carga el .env completo: así no hereda las claves de la API.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-timetracker}
      POSTGRES_USER: ${POSTGRES_USER:-timetracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timetracker-dev-local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 guarda sus datos en una subcarpeta versionada de /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: timetracker-api:local
    # El .env es opcional (requiere Compose 2.24 o superior). Si existe, sobrescribe la configuración de desarrollo,
    # por ejemplo para abrir el registro de compañías y desactivar la siembra de demostración (véase el README).
    env_file:
      - path: .env
        required: false
    # `environment` prevalece sobre `env_file`: aquí solo va lo que Compose necesita fijar. La clave de firma, la siembra y el registro
    # no se fijan aquí para que un .env pueda sobrescribirlos.
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ApplyMigrationsOnStartup: "true"
      # Dentro del contenedor la base está en el servicio `postgres`, no en localhost.
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-timetracker};Username=${POSTGRES_USER:-timetracker};Password=${POSTGRES_PASSWORD:-timetracker-dev-local}
    # Para llegar a un Ollama que corre en el anfitrión (Ai__Endpoint=http://host.docker.internal:11434/); en Linux no existe por defecto.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # El puerto de host 5274 coincide con ApiBaseUrl de la Web.
      - "127.0.0.1:5274:8080"

volumes:
  pgdata:
